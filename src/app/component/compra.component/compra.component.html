<div class="carrito-container">
  <h2>Carrito de Compras</h2>

  <ng-container *ngIf="carrito$ | async as carrito">
    
    <div *ngIf="carrito.length === 0" class="carrito-vacio">
      <p>Tu carrito está vacío. ¡Agregá un calefactor desde el catálogo!</p>
    </div>

    <div *ngIf="carrito.length > 0">
      <ul class="carrito-lista">
        <li *ngFor="let item of carrito" class="carrito-item">
          <div class="item-info">
            <h3>{{ item.nombre }}</h3>
            <p><strong>Precio:</strong> ${{ item.precio }}</p>
            <p><strong>En el carrito:</strong> {{ item.cantidad }} unidades</p>
          </div>

          <div class="item-descarte">
            <label>Cantidad a eliminar:</label>
            
            <app-input-integer
              #cantEliminar
              [cantidad]="1"
              [maximo]="item.cantidad"
              (cantidadChange)="cantEliminar.cantidad = $event">
            </app-input-integer>

            <button class="btn-quitar" (click)="carritoService.quitar(item.id_calefactor, cantEliminar.cantidad)">
              Quitar del carrito
            </button>
          </div>
        </li>
      </ul>

      <div class="carrito-total">
        <p><strong>Total a pagar:</strong> ${{ calcularTotal(carrito) }}</p>
        <p><strong>Cantidad total de ítems:</strong> {{ calcularCantidadTotal(carrito) }}</p>

        <button class="btn-vaciar" (click)="carritoService.vaciar()">Vaciar carrito</button>
        <button class="btn-comprar" (click)="confirmarCompra()">Confirmar compra</button>
      </div>
    </div>

  </ng-container>
</div>
