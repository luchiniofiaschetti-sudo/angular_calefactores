<div class="botonera">
   <button (click)="restarCantidad()" [disabled]="cantidad <= 0">–</button>
   <input 
      type="number" 
      [ngModel]="cantidad"
      (ngModelChange)="onChangeInput($event)"
      [min]="0"
      [max]="maximo">
   <button (click)="sumarCantidad()" [disabled]="cantidad >= maximo">+</button>
</div>
